<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>NamDTU Tizimlari - Yagona ta'lim tizimlari</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#0A1052" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f9f9ff" media="(prefers-color-scheme: light)" />
  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="shortcut icon" type="image/jpeg" href="/logo-namdtu.jpeg" />
  <link rel="apple-touch-icon" href="/logo-namdtu.jpeg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="hub.namdtu.uz" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark' || !saved) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
